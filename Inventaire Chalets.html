<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inventaire Chalets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: écran unique en colonne étroite, pensé pour téléphone/iPad. Départ -> comptage -> récapitulatif -> confirmation. */
:root {
  --bg: #eef1ec;
  --surface: #ffffff;
  --surface-2: #e3e9e1;
  --ink: #1d2a24;
  --ink-soft: #55645b;
  --line: #cfd8cd;
  --accent: #8a2c48;
  --accent-ink: #ffffff;
  --pine: #2e5b4d;
  --ok: #2e7d4f;
  --warn: #b3261e;
  --warn-bg: #fbe9e7;
  --ok-bg: #e4f2e8;
  --hint: #7a4b00;
  --hint-bg: #fff1cc;
  --font-display: "Young Serif", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b17;
    --surface: #1c2621;
    --surface-2: #26332c;
    --ink: #e8efe9;
    --ink-soft: #9fb0a5;
    --line: #34443b;
    --accent: #e0829d;
    --accent-ink: #1d1016;
    --pine: #7fc0aa;
    --ok: #6fcf93;
    --warn: #ff9c93;
    --warn-bg: #3a1f1d;
    --ok-bg: #1d3326;
  --hint: #f2c05c;
  --hint-bg: #3b2e10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131b17;
  --surface: #1c2621;
  --surface-2: #26332c;
  --ink: #e8efe9;
  --ink-soft: #9fb0a5;
  --line: #34443b;
  --accent: #e0829d;
  --accent-ink: #1d1016;
  --pine: #7fc0aa;
  --ok: #6fcf93;
  --warn: #ff9c93;
  --warn-bg: #3a1f1d;
  --ok-bg: #1d3326;
  --hint: #f2c05c;
  --hint-bg: #3b2e10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 21px; }
p { margin: 0; }
.soft { color: var(--ink-soft); font-size: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--pine); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
label { font-weight: 600; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 48px; width: 100%;
}
textarea { min-height: 120px; font-size: 14px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
button { font: inherit; cursor: pointer; }
.btn {
  min-height: 48px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.error { color: var(--warn); font-size: 14px; font-weight: 600; min-height: 1em; }

/* Barre résumé */
.summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.summary b { font-weight: 700; }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 600; padding: 8px 0; text-decoration: underline; }

/* Lignes d'articles */
.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.item {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center;
}
.item.done { border-color: var(--pine); }
.item { box-shadow: inset 8px 0 0 var(--tc, transparent); padding-left: 20px; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.item .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .name input { min-height: 40px; padding: 8px 10px; }
.item .exp { font-size: 15px; font-weight: 600; color: var(--pine); font-variant-numeric: tabular-nums; }
#app > header { order: -2; }
#theoryBox { order: -1; }
.total { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.total small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
.steppers { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.stepper { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }
.stepper > span { font-size: 12px; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stepper .ctl { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; }
.stepper .ctl button {
  min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink); font-size: 24px; font-weight: 600; line-height: 1; padding: 0;
}
.stepper .ctl button:active { background: var(--line); }
.stepper .ctl input { text-align: center; font-weight: 700; font-size: 20px; padding: 6px; font-variant-numeric: tabular-nums; }
.short { flex: 1 1 100%; }
.acts { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; }
.acts .zero { min-height: 44px; padding: 0 12px; font-size: 14px; }
.note { flex: 1 1 100%; }
.note input { min-height: 44px; font-size: 15px; }
.zero { min-height: 48px; padding: 0 14px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; color: var(--ink-soft); font-weight: 600; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.hint { background: var(--hint-bg); color: var(--hint); }
.diff-list li.hint { background: var(--hint-bg); color: var(--hint); }
.badge.diff { background: var(--warn-bg); color: var(--warn); }

/* Barre du bas */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 560px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.bar-in .prog { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--pine); width: 0; transition: width .2s; }
.bar-in .btn { flex: 0 0 auto; }

/* Récapitulatif */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; overflow-wrap: anywhere; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.diff-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.diff-list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; background: var(--warn-bg); border-radius: 8px; font-weight: 600; }
.notice { background: var(--surface-2); border-radius: 8px; padding: 12px; font-size: 14px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.confirm { text-align: center; align-items: center; }
.confirm .check { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; font-size: 30px; font-weight: 700; }
.addr { font-weight: 700; overflow-wrap: anywhere; user-select: all; }
pre#txt { white-space: pre-wrap; font-family: var(--font-body); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0; text-align: left; max-height: 260px; overflow: auto; width: 100%; }
details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
details[open] summary { margin-bottom: 10px; }
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
</style>

<main id="app"></main>
<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="prog"><span id="progtxt"></span><div class="meter"><i id="progbar"></i></div></div>
    <button class="btn primary" id="finish" type="button">Terminer</button>
  </div>
</div>

<script>
(function () {
  var CARTON = 40;
  var MAIL = "vincent.chavot@icloud.com";
  var TEAS = ["Cap ou pas Cap","Cherry Christmas","Cocktail de Noël","Cocktail des îles","Délice Detox","Earl Grey Royal","Féérie des Lutins","Fleur de Lune","Fleur sauvage","Goji Party","L'heure du goûter","La vie en rose","Le Thé du Père Noël","Macaron Violette","Marrons Chauds Caramel","Mojito Framboise","Noël à la Ville","Noël en Alsace","Noël en rêves","Nuit étoilée","Ptits Pirates","Rooibos de Noël","Rose Litchi","Secret des Anges","Yéti Chéri"];
  var OTHERS = ["Coffret 2026","Sac (Coffret)","Sac (Kraft)","Gobelets","MUG OLD","Pince à Thé","Mini Sachet 30g"];
  // Taille du carton (ou de la pile) par article. Les thés se comptent par cartons de 40.
  var TEA_PACK = { size: 40, noun: "carton", plural: "cartons" };
  var PACKS = {
    "Coffret 2026": { size: 50, noun: "carton", plural: "cartons" },
    "Sac (Kraft)": { size: 250, noun: "carton", plural: "cartons" },
    "Gobelets": { size: 100, noun: "pile", plural: "piles" },
    "Pince à Thé": { size: 400, noun: "carton", plural: "cartons" },
    "Mini Sachet 30g": { size: 75, noun: "carton", plural: "cartons" }
  };
  function packOf(it) { return it.kind === "tea" ? TEA_PACK : (PACKS[it.name] || null); }
  function packTitle(pk) { return (pk.noun === "pile" ? "Piles" : "Cartons") + " de " + pk.size; }
  // Couleurs provisoires, à remplacer par celles des étiquettes Maison Bourgeon.
  var TEA_COLORS = {
    "Cap ou pas Cap": "#E0A21B", "Cherry Christmas": "#C8283C", "Cocktail de Noël": "#D9531E", "Cocktail des îles": "#1FA5A0",
    "Délice Detox": "#5FA33A", "Earl Grey Royal": "#3D56A6", "Féérie des Lutins": "#2E8B57", "Fleur de Lune": "#7C6FC2",
    "Fleur sauvage": "#D8688F", "Goji Party": "#E8483F", "L'heure du goûter": "#D99A5B", "La vie en rose": "#EC7FA7",
    "Le Thé du Père Noël": "#B3232F", "Macaron Violette": "#8E4FB5", "Marrons Chauds Caramel": "#8A5A2B", "Mojito Framboise": "#B5316E",
    "Noël à la Ville": "#4F6D8F", "Noël en Alsace": "#9E3B2A", "Noël en rêves": "#4C8DD1", "Nuit étoilée": "#232F6B",
    "Ptits Pirates": "#2A9DB8", "Rooibos de Noël": "#CC6A1A", "Rose Litchi": "#F08FA0", "Secret des Anges": "#A9B7E0", "Yéti Chéri": "#7FC6E6"
  };
  var FREE_COUNT = 5;
  var STANDS = ["Annecy - Jardin de l'Europe","Annecy - Saint François","Belgatrans Metz","Clermont-Ferrand","ZAE","Georges Center","Grenoble","Lyon","Metz","Montbéliard","Mulhouse","Strasbourg - Cathédrale","Strasbourg - Château","Strasbourg - Local","Strasbourg - OR","Strasbourg - St Thomas"]
    .sort(function (a, b) { return a.localeCompare(b, "fr"); });
  // Stock théorique intégré à la page : { "Lyon": { "Earl Grey Royal": 120, ... } }
  var BUILTIN_THEORY = {};

  var KEY = "inventaire-chalets-v1";
  var app = document.getElementById("app");
  var bar = document.getElementById("bar");

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var j = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + j;
  }
  function norm(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function fmtDate(iso) {
    var p = iso.split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }

  function freshItems() {
    var items = [];
    TEAS.forEach(function (n) { items.push({ name: n, kind: "tea", c: 0, u: 0, t: false, s: 0, sv: false, st: false }); });
    OTHERS.forEach(function (n) { items.push({ name: n, kind: "other", c: 0, u: 0, t: false }); });
    for (var i = 0; i < FREE_COUNT; i++) items.push({ name: "", kind: "free", c: 0, u: 0, t: false });
    return items;
  }
  var state = { step: "start", date: todayISO(), nom: "", stand: "", items: freshItems(), theory: {}, theoryAt: {}, lastImport: [], note: "", validatedAt: "" };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && s.items && s.items.length === state.items.length) {
        state.step = s.step === "confirm" ? "confirm" : (s.step || "start");
        state.date = s.date || state.date;
        state.nom = s.nom || "";
        state.stand = s.stand || "";
        state.items = s.items;
        state.theory = s.theory || {};
        state.theoryAt = s.theoryAt || {};
        state.lastImport = s.lastImport || [];
        state.validatedAt = s.validatedAt || "";
        state.note = s.note || "";
      } else if (s && s.theory) {
        state.theory = s.theory;
        state.theoryAt = s.theoryAt || {};
        state.lastImport = s.lastImport || [];
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function expectedFor(name) {
    var key = norm(name);
    if (!key) return undefined;
    var src = state.theory[state.stand] || BUILTIN_THEORY[state.stand];
    if (!src) return undefined;
    for (var k in src) { if (norm(k) === key) return src[k]; }
    return undefined;
  }
  function expectedShort(name) { return expectedFor(name + " DLUO COURTE"); }
  function nowStamp() { var d = new Date(); return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function dateSuffix() { var at = (state.theoryAt || {})[state.stand]; return at ? " le " + at + "." : "."; }
  function hasTheory() { return !!(state.theory[state.stand] || BUILTIN_THEORY[state.stand]); }
  function total(it) { var pk = packOf(it); return it.c * (pk ? pk.size : 0) + it.u; }
  function label(it, i) { return it.kind === "free" ? (it.name.trim() || "Ligne libre " + (i - TEAS.length - OTHERS.length + 1)) : it.name; }
  function signed(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); }
  // Écart proche d'un multiple de la taille du carton (ou de la pile) : probablement une erreur de comptage.
  function cartonHint(d, pack) {
    if (!pack) return 0;
    var a = Math.abs(d), k = Math.round(a / pack.size);
    return (k >= 1 && Math.abs(a - k * pack.size) <= 3) ? k : 0;
  }
  function hintText(k, pack) { return "≈ " + k + " " + (pack ? (k > 1 ? pack.plural : pack.noun) : "carton" + (k > 1 ? "s" : "")); }
  function badgeFor(d, pack) {
    if (d === 0) return '<span class="badge ok">= OK</span>';
    var k = cartonHint(d, pack);
    return k ? '<span class="badge hint">' + signed(d) + " · " + hintText(k, pack) + '</span>' : '<span class="badge diff">' + signed(d) + '</span>';
  }
  function diffListHTML(diffs) {
    var any = diffs.some(function (r) { return r.hint; });
    return '<ul class="diff-list">' + diffs.map(function (r) {
      return '<li' + (r.hint ? ' class="hint"' : '') + '><span>' + esc(r.name) + (r.hint ? ' <small>(' + hintText(r.hint, r.pack) + ')</small>' : '') + '</span><span>' + signed(r.diff) + '</span></li>';
    }).join("") + '</ul>' + (any ? '<p class="soft">Les lignes en jaune sont proches d\'un carton ou d\'une pile entière : probablement une erreur de comptage.</p>' : '');
  }
  function clampInt(v) { var n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : n; }

  /* ---------- Écran 1 : départ ---------- */
  function renderStart() {
    bar.hidden = true;
    var theoryNote = state.stand
      ? (hasTheory() ? "Stock théorique chargé pour " + state.stand + dateSuffix() : "Aucun stock théorique chargé pour " + state.stand + ".")
      : "Choisissez d'abord un stand.";
    app.innerHTML =
      '<header><div class="eyebrow">Marchés de Noël</div><h1>Inventaire hebdomadaire</h1></header>' +
      '<form class="card" id="startForm" novalidate>' +
        '<label for="date">Date<input id="date" type="date" value="' + esc(state.date) + '"></label>' +
        '<label for="nom">Votre nom<input id="nom" type="text" autocomplete="name" value="' + esc(state.nom) + '" placeholder="Prénom"></label>' +
        '<label for="stand">Stand<select id="stand"><option value="">Choisir un stand</option>' +
          STANDS.map(function (s) { return '<option' + (s === state.stand ? " selected" : "") + '>' + esc(s) + '</option>'; }).join("") +
        '</select></label>' +
        '<div class="error" id="err" role="alert"></div>' +
        '<div class="notice warn" id="warn" role="alert" hidden><p id="warnTxt"></p><div class="row" style="margin-top:10px"><button class="btn" type="button" id="warnFix">Changer de stand</button><button class="btn" type="button" id="warnGo">Continuer quand même</button></div></div>' +
        '<button class="btn primary" type="submit">Commencer l\'inventaire</button>' +
      '</form>' +
      '<details class="card" id="theoryBox" open><summary>Stock du soir : importer le fichier</summary>' +
        '<p class="soft" id="theoryNote">' + esc(theoryNote) + '</p>' +
        '<p class="soft">Choisissez le fichier d\'export Lightspeed (PDF, CSV ou Excel), ou collez le texte reçu par message. Le stand est lu dans la colonne Stock. Les lignes DLUO COURTE sont gardées comme un décompte à part. Le stock est gardé sur cet appareil.</p>' +
        '<label for="theoryFile">Fichier de stock (PDF, CSV ou Excel)<input id="theoryFile" type="file"></label>' +
        '<p class="soft">Stock reçu en PDF dans une conversation : ouvrez-le, enregistrez-le dans Fichiers (ou Téléchargements), puis choisissez-le ci-dessus.</p>' +
        '<label for="theoryTxt">Ou collez le stock reçu par message<span class="soft"> (copiez le texte du message, il se charge dès que vous le collez)</span></label>' +
        '<textarea id="theoryTxt" placeholder="Grenoble;S100.07;Earl Grey Royal;63&#10;Grenoble;S100.26;Rose Litchi;108"></textarea>' +
        '<div class="row"><button class="btn" type="button" id="theoryLoad">Charger le stock</button><button class="btn quiet" type="button" id="theoryClear">Effacer</button></div>' +
        '<div class="soft" id="theoryMsg" role="status"></div>' +
      '</details>' +
      (hasProgress() ? '<button class="btn quiet" type="button" id="reset">Recommencer un nouvel inventaire</button>' : '');

    var standSel = document.getElementById("stand");
    standSel.addEventListener("change", function () {
      state.stand = standSel.value; save();
      document.getElementById("warn").hidden = true;
      var n = document.getElementById("theoryNote");
      n.textContent = state.stand ? (hasTheory() ? "Stock théorique chargé pour " + state.stand + dateSuffix() : "Aucun stock théorique chargé pour " + state.stand + ".") : "Choisissez d'abord un stand.";
    });
    document.getElementById("date").addEventListener("change", function (e) { state.date = e.target.value; save(); });
    document.getElementById("nom").addEventListener("input", function (e) { state.nom = e.target.value; save(); });
    document.getElementById("startForm").addEventListener("submit", function (e) {
      e.preventDefault();
      state.date = document.getElementById("date").value;
      state.nom = document.getElementById("nom").value.trim();
      state.stand = standSel.value;
      var err = document.getElementById("err");
      if (!state.date) { err.textContent = "Indiquez la date."; return; }
      if (!state.nom) { err.textContent = "Indiquez votre nom."; return; }

    }
    if (b.dataset.reset !== undefined) {
      var rI = +b.dataset.reset, ri = state.items[rI];
      ri.c = 0; ri.u = 0; ri.t = false;
      if (ri.kind === "tea") { ri.s = 0; ri.st = false; }
      document.getElementById("item" + rI).querySelectorAll("input[data-f]").forEach(function (inp) { inp.value = 0; });
      updateRow(rI); updateProgress(); save();
      return;
    }
    if (b.dataset.note !== undefined) {
      var nI = +b.dataset.note;
      document.getElementById("note" + nI).hidden = false;
      b.hidden = true;
      var nin = document.querySelector("#note" + nI + " input");
      if (nin) nin.focus();
      return;
    }
    if (b.dataset.short !== undefined) {
      var sI = +b.dataset.short;
      state.items[sI].sv = true;
      document.getElementById("short" + sI).hidden = false;
      b.hidden = true; save();
      return;
    }
    if (b.dataset.d) {
      var i = +b.dataset.i, f = b.dataset.f;
      setField(i, f, state.items[i][f] + (+b.dataset.d));
      var inp = document.querySelector('#item' + i + ' input[data-f="' + f + '"]');
      if (inp) inp.value = state.items[i][f];
    }
  });
  app.addEventListener("input", function (e) {
    var t = e.target;
    if (t.matches('input[type="number"][data-f]')) {
      var i = +t.dataset.i, f = t.dataset.f;
      var it = state.items[i];
      it[f] = clampInt(t.value);
      if (f === "s") it.st = true; else it.t = true;
      updateRow(i); updateProgress(); save();
    } else if (t.matches(".notetxt")) {
      state.items[+t.dataset.i].n = t.value; save();
    } else if (t.matches(".freename")) {
      state.items[+t.dataset.i].name = t.value; save();
      updateRow(+t.dataset.i);
    }
  });
  app.addEventListener("focusin", function (e) {
    if (e.target.matches('input[type="number"]')) { try { e.target.select(); } catch (x) {} }
  });
  app.addEventListener("focusout", function (e) {
    var t = e.target;
    if (t.matches('input[type="number"][data-f]')) t.value = state.items[+t.dataset.i][t.dataset.f];
  });

  /* ---------- Écran 3 : récapitulatif ---------- */
  function buildRows() {
    var rows = [];
    state.items.forEach(function (it, i) {
      if (it.kind === "free" && !it.name.trim() && !it.t) return;
      if (it.kind === "free" && !it.name.trim() && total(it) === 0) return;
      var exp = expectedFor(it.name);
      var cnt = total(it);
      rows.push({ name: label(it, i), counted: it.t, count: cnt, cartons: it.c, units: it.u, exp: exp, diff: (exp !== undefined && it.t) ? cnt - exp : null, kind: it.kind, pack: packOf(it), note: (it.n || "").trim() });
      if (it.kind === "tea" && (it.sv || it.s > 0)) {
        var es = expectedShort(it.name);
        rows.push({ name: label(it, i) + " (DLUO courte)", counted: it.st, count: it.s, cartons: 0, units: it.s, exp: es, diff: (es !== undefined && it.st) ? it.s - es : null, kind: "short", pack: TEA_PACK });
      }
    });
    rows.forEach(function (r) { r.hint = r.diff ? cartonHint(r.diff, r.pack) : 0; });
    return rows;
  }
  function recapText(rows) {
    var L = [];
    L.push("INVENTAIRE " + state.stand.toUpperCase());
    L.push("Date : " + fmtDate(state.date));
    L.push("Saisi par : " + state.nom);
    if (state.validatedAt) L.push("Validé le : " + state.validatedAt);
    L.push("");
    if (state.note && state.note.trim()) { L.push("COMMENTAIRE GÉNÉRAL"); L.push(state.note.trim()); L.push(""); }
    if (hasTheory()) {
      var diffs = rows.filter(function (r) { return r.diff !== null && r.diff !== 0; });
      L.push("ÉCARTS À REPORTER (" + diffs.length + ")");
      if (!diffs.length) L.push("Aucun écart.");
      diffs.forEach(function (r) { L.push("- " + r.name + " : " + signed(r.diff) + " (compté " + r.count + ", attendu " + r.exp + ")" + (r.hint ? " [" + hintText(r.hint, r.pack) + " : erreur de carton probable]" : "") + (r.note ? " | commentaire : " + r.note : "")); });
      L.push("");
    }
    L.push("DÉTAIL");
    rows.forEach(function (r) {
      var part = r.counted ? r.count + (r.pack && r.cartons ? " (" + r.cartons + " " + (r.cartons > 1 ? r.pack.plural : r.pack.noun) + " + " + r.units + ")" : "") : "non compté";
      var ex = r.exp !== undefined ? " | attendu " + r.exp : "";
      L.push("- " + r.name + " : " + part + ex + (r.note ? " | commentaire : " + r.note : ""));
    });
    return L.join("\n");
  }
  function renderReview() {
    bar.hidden = true;
    var rows = buildRows();
    var missing = rows.filter(function (r) { return !r.counted && r.kind !== "free" && r.kind !== "short"; });
    var diffs = rows.filter(function (r) { return r.diff !== null && r.diff !== 0; });
    var html = '<header><div class="eyebrow">' + esc(state.stand) + ' · ' + esc(fmtDate(state.date)) + ' · ' + esc(state.nom) + '</div><h1>Vérifier avant de valider</h1></header>';
    if (missing.length) {
      html += '<div class="notice warn">' + missing.length + ' article(s) non compté(s) : ' + esc(missing.map(function (r) { return r.name; }).join(", ")) + '. Ils seront envoyés comme « non compté ».</div>';
    }
    if (hasTheory()) {
      html += '<section class="card"><h2>Écarts avec le stock théorique</h2>';
      html += diffs.length
        ? diffListHTML(diffs)
        : '<p class="soft">Aucun écart : tout correspond.</p>';
      html += '</section>';
    }
    html += '<section class="card"><h2>Détail</h2><div class="table-wrap"><table><thead><tr><th>Article</th><th>Compté</th>' + (hasTheory() ? '<th>Attendu</th><th>Écart</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td>' + esc(r.name) + (r.note ? '<br><small class="soft">' + esc(r.note) + '</small>' : '') + '</td><td>' + (r.counted ? r.count : '—') + '</td>' +
          (hasTheory() ? '<td>' + (r.exp !== undefined ? r.exp : '') + '</td><td>' + (r.diff === null ? '' : badgeFor(r.diff, r.pack)) + '</td>' : '') + '</tr>';
      }).join("") + '</tbody></table></div></section>';
    html += '<section class="card"><h2>Commentaire général</h2><label for="generalNote"><span class="soft">Facultatif : casse, manque, remarque sur le stand…</span><textarea id="generalNote" placeholder="Votre remarque">' + esc(state.note || "") + '</textarea></label></section>';
    html += '<div class="row"><button class="btn" type="button" id="edit">Revenir au comptage</button><button class="btn primary" type="button" id="validate">Valider l\'inventaire</button></div>';
    app.innerHTML = html;
    document.getElementById("generalNote").addEventListener("input", function (e) { state.note = e.target.value; save(); });
    document.getElementById("edit").addEventListener("click", function () { state.step = "count"; save(); render(); });
    document.getElementById("validate").addEventListener("click", function () {
      var d = new Date();
      state.validatedAt = d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      state.step = "confirm"; save(); render(); window.scrollTo(0, 0);
    });
  }

  // Génère un PDF (Helvetica, A4 portrait) : écarts à reporter, puis détail complet.
  function buildPdf(rows, meta) {
    var W = 595, H = 842, M = 40, ROW = 16;
    var pages = [], ops, y;
    var MAP = { "’": 146, "‘": 145, "œ": 156, "Œ": 140, "–": 150, "—": 151, "€": 128, "…": 133, "−": 45, "≈": 126 };
    function win(str) {
      var o = "";
      for (var i = 0; i < str.length; i++) {
        var ch = str.charAt(i), c = str.charCodeAt(i);
        var code = MAP[ch] !== undefined ? MAP[ch] : (c < 256 ? c : 63);
        if (code === 40 || code === 41 || code === 92) o += "\\";
        o += String.fromCharCode(code);
      }
      return o;
    }
    function tw(str, size, bold) {
      var w = 0;
      for (var i = 0; i < str.length; i++) {
        var ch = str.charAt(i);
        w += /\d/.test(ch) ? 0.556 : ch === " " ? 0.278 : ch === "+" || ch === "≈" ? 0.584 : ch === "-" ? 0.333 : (bold ? 0.58 : 0.5);
      }
      return w * size;
    }
    function num(n) { return (Math.round(n * 100) / 100).toString(); }
    function wrap(str, size, maxW) {
      var words = String(str).replace(/\s+/g, " ").trim().split(" "), lines = [], cur = "";
      words.forEach(function (w) {
        var t = cur ? cur + " " + w : w;
        if (tw(t, size, false) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
      });
      if (cur) lines.push(cur);
      return lines;
    }
    function text(x, yTop, str, size, bold, align) {
      var px = align === "right" ? x - tw(str, size, bold) : x;
      ops.push("BT /" + (bold ? "F2" : "F1") + " " + size + " Tf 0 g " + num(px) + " " + num(H - yTop - size) + " Td (" + win(str) + ") Tj ET");
    }
    function fill(x, yTop, w, h, r, g, b) {
      ops.push("q " + r + " " + g + " " + b + " rg " + num(x) + " " + num(H - yTop - h) + " " + num(w) + " " + num(h) + " re f Q");
    }
    function line(yTop) {
      ops.push("q 0.5 w 0.8 G " + M + " " + num(H - yTop) + " m " + (W - M) + " " + num(H - yTop) + " l S Q");
    }
    function newPage() { ops = []; pages.push(ops); y = M; }
    var theory = rows.some(function (r) { return r.exp !== undefined; });
    var C = theory ? { exp: 330, real: 395, diff: 462, rem: 472 } : { real: 400 };
    function header() {
      fill(M, y, W - 2 * M, 18, 0.9, 0.92, 0.9);
      text(M + 4, y + 5, "Article", 8.5, true);
      if (theory) text(C.exp, y + 5, "Théorique", 8.5, true, "right");
      text(C.real, y + 5, "Réel", 8.5, true, "right");
      if (theory) { text(C.diff, y + 5, "Différence", 8.5, true, "right"); text(C.rem, y + 5, "Remarque", 8.5, true); }
      y += 18;
    }
    function table(title, list) {
      if (y + 60 > H - M - 20) newPage();
      text(M, y, title, 12, true);
      y += 20;
      header();
      list.forEach(function (r) {
        if (y + ROW > H - M - 20) { newPage(); header(); }
        var bad = theory && r.diff !== null && r.diff !== 0;
        if (bad) { if (r.hint) fill(M, y, W - 2 * M, ROW, 1, 0.94, 0.75); else fill(M, y, W - 2 * M, ROW, 0.98, 0.9, 0.89); }
        var nm = r.name.length > 52 ? r.name.slice(0, 51) + "…" : r.name;
        text(M + 4, y + 4, nm, 9, bad);
        if (theory) text(C.exp, y + 4, r.exp === undefined ? "-" : String(r.exp), 9, false, "right");
        text(C.real, y + 4, r.counted ? String(r.count) : "non compté", 9, bad, "right");
        if (theory) {
          if (r.diff !== null) text(C.diff, y + 4, r.diff === 0 ? "0" : (r.diff > 0 ? "+" : "-") + Math.abs(r.diff), 9, bad, "right");
          if (r.hint) text(C.rem, y + 4, hintText(r.hint, r.pack), 8, false);
        }
        y += ROW;
        line(y);
      });
      y += 14;
    }
    newPage();
    text(M, y, "Inventaire " + meta.stand, 18, true); y += 28;
    text(M, y, "Date : " + meta.date + "     Saisi par : " + meta.nom, 10, false); y += 15;
    if (meta.validatedAt) { text(M, y, "Validé le " + meta.validatedAt, 10, false); y += 15; }
    if (meta.note && meta.note.trim()) {
      text(M, y, "Commentaire général", 10, true); y += 15;
      wrap(meta.note, 9.5, 430).forEach(function (ln) { if (y + 14 > H - M - 20) newPage(); text(M, y, ln, 9.5, false); y += 13; });
      y += 10;
    }
    var diffs = rows.filter(function (r) { return theory && r.diff !== null && r.diff !== 0; });
    var hints = diffs.filter(function (r) { return r.hint; }).length;
    if (theory) {
      text(M, y, diffs.length + " écart(s) à reporter" + (hints ? ", dont " + hints + " probablement dû(s) à une erreur de carton ou de pile" : ""), 10, true);
      y += 24;
      if (diffs.length) table("Écarts à reporter", diffs);
    } else { y += 8; }
    table("Détail complet", rows);
    var noted = rows.filter(function (r) { return r.note; });
    if (noted.length) {
      if (y + 40 > H - M - 20) newPage();
      text(M, y, "Commentaires par article", 12, true); y += 20;
      noted.forEach(function (r) {
        var ls = wrap(r.note, 9, 430);
        if (y + 13 + ls.length * 12 + 6 > H - M - 20) newPage();
        text(M, y, r.name, 9, true); y += 13;
        ls.forEach(function (ln) { text(M + 10, y, ln, 9, false); y += 12; });
        y += 6;
      });
    }
    pages.forEach(function (pg, i) {
      ops = pg;
      text(W - M, H - 30, "Page " + (i + 1) + " / " + pages.length, 8, false, "right");
    });
    var objs = [null];
    var kids = [];
    pages.forEach(function (_, i) { kids.push((5 + 2 * i) + " 0 R"); });
    objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objs[2] = "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + pages.length + " >>";
    objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    pages.forEach(function (pg, i) {
      var data = pg.join("\n");
      objs[5 + 2 * i] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents " + (6 + 2 * i) + " 0 R >>";
      objs[6 + 2 * i] = "<< /Length " + data.length + " >>\nstream\n" + data + "\nendstream";
    });
    var out = "%PDF-1.4\n", offs = [];
    for (var i = 1; i < objs.length; i++) { offs[i] = out.length; out += i + " 0 obj\n" + objs[i] + "\nendobj\n"; }
    var xref = out.length;
    out += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
    for (var j = 1; j < objs.length; j++) out += ("0000000000" + offs[j]).slice(-10) + " 00000 n \n";
    out += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
    var bytes = new Uint8Array(out.length);
    for (var k = 0; k < out.length; k++) bytes[k] = out.charCodeAt(k) & 255;
    return bytes;
  }

  /* ---------- Écran 4 : confirmation ---------- */
  function renderConfirm() {
    bar.hidden = true;
    var rows = buildRows();
    var text = recapText(rows);
    var subject = "Inventaire " + state.stand + " - " + fmtDate(state.date);
    var href = "mailto:" + MAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(text);
    app.innerHTML =
      '<section class="card confirm"><div class="check" aria-hidden="true">✓</div>' +
        '<h1>Inventaire validé</h1>' +
        '<p class="soft">' + esc(state.stand) + ' · ' + esc(fmtDate(state.date)) + ' · ' + esc(state.nom) + '<br>Validé le ' + esc(state.validatedAt) + '</p></section>' +
      '<section class="card"><h2>Envoyer le récapitulatif</h2>' +
        '<p>Destinataire : <span class="addr">' + MAIL + '</span></p>' +
        '<button class="btn primary" type="button" id="pdfbtn" hidden>Enregistrer le PDF (théorique, réel, différence)</button>' +
        '<div class="row"><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="' + href + '">Ouvrir dans Mail</a><button class="btn" type="button" id="copy">Copier le récapitulatif</button></div>' +
        '<div class="soft" id="copymsg" role="status">Si Mail ne s\'ouvre pas, copiez le récapitulatif et envoyez-le à l\'adresse ci-dessus. Le récapitulatif n\'est envoyé que lorsque vous appuyez sur « Envoyer » dans Mail.</div>' +
        '<pre id="txt">' + esc(text) + '</pre>' +
      '</section>' +
      '<div class="row"><button class="btn" type="button" id="reopen">Corriger l\'inventaire</button><button class="btn quiet" type="button" id="newinv">Nouvel inventaire</button></div>';
    document.getElementById("copy").addEventListener("click", function () {
      var msg = document.getElementById("copymsg");
      function fallback() {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("txt"));
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        msg.textContent = "Texte sélectionné : copiez-le avec le menu de votre appareil.";
      }
      try {
        navigator.clipboard.writeText(text).then(function () { msg.textContent = "Récapitulatif copié."; }, fallback);
      } catch (e) { fallback(); }
    });
    (function () {
      var claudeApi = window.claude;
      if (!claudeApi || !claudeApi.use) return;
      claudeApi.use("downloads").then(function (dl) {
        var btn = document.getElementById("pdfbtn");
        if (!dl || !btn) return;
        btn.hidden = false;
        btn.addEventListener("click", function () {
          var msg = document.getElementById("copymsg");
          var name = ("Inventaire " + state.stand + " " + state.date + ".pdf").replace(/[\\/:*?"<>|]/g, "-");
          var bytes = buildPdf(buildRows(), { stand: state.stand, date: fmtDate(state.date), nom: state.nom, validatedAt: state.validatedAt, note: state.note });
          dl.save({ filename: name, data: bytes }).then(function () {
            msg.textContent = "PDF enregistré. Joignez-le à votre mail pour l'envoyer.";
          }, function (err) {
            if (err && err.code === "declined") return;
            msg.textContent = "Enregistrement du PDF impossible ici. Copiez le récapitulatif à la place.";
          });
        });
      }, function () {});
    })();
    document.getElementById("reopen").addEventListener("click", function () { state.step = "count"; state.validatedAt = ""; save(); render(); });
    document.getElementById("newinv").addEventListener("click", function () { resetAll(); });
  }

  document.getElementById("finish").addEventListener("click", function () {
    state.step = "review"; save(); render(); window.scrollTo(0, 0);
  });

  function render() {
    if (state.step === "count") renderCount();
    else if (state.step === "review") renderReview();
    else if (state.step === "confirm") renderConfirm();
    else renderStart();
  }
  load();
  render();
})();
</script>

</body></html>
